const API_AUTO='__API_URL__';

// Sinkronisasi diam-diam (saat ngetik/save otomatis)
async function apPushSilently(){
  setSt('Menyimpan ke Spreadsheet...');
  try{ await api({action:'save',data:S}); setSt('Tersimpan di Spreadsheet \u00b7 '+new Date().toLocaleTimeString('id-ID')); }
  catch(e){ setSt('Gagal menyimpan: '+e.message); toast('Gagal menyimpan ke Spreadsheet: '+e.message); }
}

// PUSH/PULL DENGAN SWEETALERT2
async function apPush(){
  Swal.fire({ title: 'Menyimpan...', text: 'Mengirim data ke Spreadsheet', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
  try {
    await api({action:'save',data:S});
    setSt('Tersimpan di Spreadsheet \u00b7 '+new Date().toLocaleTimeString('id-ID'));
    Swal.fire({ icon: 'success', title: 'Tersimpan', text: 'Data berhasil disinkronkan!', timer: 2000, showConfirmButton: false });
  } catch(e) {
    setSt('Gagal menyimpan: '+e.message);
    Swal.fire({ icon: 'error', title: 'Gagal', text: e.message });
  }
}
async function apPull(){
  Swal.fire({ title: 'Memuat...', text: 'Menarik data dari Spreadsheet', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
  try {
    const j=await api({action:'load'});
    if(j.data&&!j.data.empty) {
      adopt(j.data); render();
      setSt('Data dimuat dari Spreadsheet \u00b7 '+new Date().toLocaleTimeString('id-ID'));
      Swal.fire({ icon: 'success', title: 'Dimuat', timer: 1500, showConfirmButton: false });
    } else {
      setSt('Spreadsheet masih kosong. Klik "Kirim ke Spreadsheet" untuk mengisi.');
      Swal.fire({ icon: 'info', title: 'Kosong', text: 'Spreadsheet masih kosong.', timer: 1500, showConfirmButton: false });
    }
  } catch(e) {
    setSt('Gagal: '+e.message);
    Swal.fire({ icon: 'error', title: 'Gagal', text: e.message });
  }
}
async function apSave(){
  try{localStorage.setItem('jasn_api',JSON.stringify({url:val('ap_u').trim(),token:val('ap_t')}))}catch(e){}
  Swal.fire({ title: 'Menguji koneksi...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
  try{
    await api({action:'ping'});
    await apPull(); 
  }catch(e){
    setSt('Koneksi gagal: '+e.message);
    Swal.fire({ icon: 'error', title: 'Koneksi gagal', text: e.message });
  }
}
async function load(){
  try{const l=localStorage.getItem('jasn');if(l)S={...S,...JSON.parse(l)}}catch(e){}
  render();
  if(cfg().url){
    try{
      const j=await api({action:'load'});
      if(j.data&&!j.data.empty){adopt(j.data);render()}
      else apPushSilently();
    }catch(e){toast('Spreadsheet tidak terjangkau: '+e.message)}
  }
}

function vSkp(){return impCard()+`<div class="card"><h3>Tambah butir SKP manual</h3><div class="grid" style="margin-top:8px">

(S.skp.map(k=>{const r=Math.round(real(k.id)*100)/100,pp=pctSkp(k),p=Math.min(100,Math.round(pp)),n=S.jurnal.filter(j=>j.skp===k.id).length;

<div class="mut">${esc(k.ind||k.desc||'')}</div>${k.link?`<div><a href="${esc(k.link)}" target="_blank" rel="noopener">Bukti dukung (Google Drive)</a></div>`:''}<div class="bar"><i style="width:${p}%"></i></div>
<div class="row sp"><span><b style="color:var(--ink)">${r}</b> / ${k.target} ${esc(k.satuan||'')} (${Math.round(pp*10)/10}%)</span><span class="mut">${n} catatan · <span class="${p+5<yearPace()?'warn':'ok'}">patokan waktu ±${yearPace()}%</span></span></div></div>`}).join('')||'<p class="mut">Belum ada butir SKP.</p>')}

function vTugas(){const ts=[...S.tugas].sort((a,b)=>(a.status==='selesai')-(b.status==='selesai')||a.deadline.localeCompare(b.deadline));
return `<div class="card"><h3>Tambah tugas</h3><div class="grid" style="margin-top:8px">
<div style="grid-column:1/-1"><label>Judul tugas</label><input id="tj"></div>
<div style="grid-column:1/-1"><label>Deskripsi pekerjaan</label><textarea id="td"></textarea></div>
<div><label>Butir SKP</label><select id="tk">${optSkp('')}</select></div>
<div><label>Mulai</label><input type="date" id="tm" value="${today()}"></div>
<div><label>Lama pengerjaan (hari)</label><input type="number" id="tl" min="1" value="3"></div>
<div><label>Deadline</label><input type="date" id="tdl" value="${addDays(today(),3)}"></div><div style="grid-column:1/-1"><label>Alasan perubahan deadline (wajib diisi hanya saat mengedit dan deadline berubah)</label><input id="tal"></div></div>
<div style="margin-top:10px"><button class="b" data-act="addT">Tambah tugas</button></div></div>`+
(ts.map(t=>{const sisa=diff(t.deadline,today()),done=t.status==='selesai',k=S.skp.find(x=>x.id===t.skp);
const st=done?'<span class="ok">Selesai</span>':sisa<0?`<span class="bad">Terlambat ${-sisa} hari</span>`:sisa<=1?`<span class="warn">Sisa ${sisa} hari</span>`:`Sisa ${sisa} hari`;
const n=S.jurnal.filter(j=>j.tugas===t.id).length;
return `<div class="card"><div class="row sp"><b style="color:var(--ink)">${esc(t.judul)}</b><span>${st}</span></div>
<div class="mut">${esc(t.desc||'')}</div>
<div class="mut">${fmt(t.mulai,{day:'numeric',month:'short'})} → ${fmt(t.deadline,{day:'numeric',month:'short',year:'numeric'})} · ${t.durasi} hari${k?' · SKP: '+esc(k.rhk):''} · ${n} catatan</div>
<div class="bar"><i style="width:${t.progres}%"></i></div>
<div class="row"><span><b style="color:var(--ink)">${t.progres}%</b></span>${done?'':`<input type="range" min="0" max="100" step="5" value="${t.progres}" data-act="prog" data-id="${t.id}" style="width:160px">
<button class="g" data-act="done" data-id="${t.id}">Tandai selesai</button><button class="g" data-act="resch" data-id="${t.id}">Ubah jadwal</button>`}<button class="g" data-act="editT" data-id="${t.id}">Edit</button><button class="x" data-act="delT" data-id="${t.id}">hapus</button></div>
${ui.resched===t.id?`<div class="sug" style="margin-top:8px"><div class="grid"><div><label>Deadline baru</label><input type="date" id="rd" value="${t.deadline}"></div>
<div><label>Lama pengerjaan baru (hari)</label><input type="number" id="rl" min="1" value="${t.durasi}"></div></div>
<label style="margin-top:6px">Penjelasan kendala (wajib)</label><textarea id="rr"></textarea>
<div style="margin-top:6px"><button class="b" data-act="reschOk" data-id="${t.id}">Simpan target baru</button> <button class="g" data-act="resch" data-id="">Batal</button></div></div>`:''}
${(t.hist||[]).length?`<div class="mut" style="margin-top:8px"><b>Riwayat perubahan:</b>${t.hist.map(h=>`<div>• ${fmt(h.tgl,{day:'numeric',month:'short'})}: ${fmt(h.dari,{day:'numeric',month:'short'})} → ${fmt(h.ke,{day:'numeric',month:'short'})} — ${esc(h.alasan)}</div>`).join('')}</div>`:''}</div>`}).join('')||'<p class="mut">Belum ada tugas.</p>')}

function wfhDates(){const o=[],end=addDays(today(),7);for(let d=addDays(today(),-35);d<=end;d=addDays(d,1)){const w=D(d).getDay();if(w===2||w===5)o.push(d)}return o.reverse()}

`<div class="row" style="margin-top:8px"><input id="al" placeholder="https://..." value="${esc(a)}" style="flex:1;min-width:200px"><button class="b" data-act="setA">Tetapkan</button></div>`}</div>

<div class="row">${l===undefined?`<button class="g" data-act="libur" data-id="${d}" data-v="1">Libur</button><button class="b" data-act="libur" data-id="${d}" data-v="0">Bukan libur</button>`:
`${l===false?`<button class="b" data-act="rep" data-id="${d}">Isi & buat laporan</button>`:''}<button class="g" data-act="libur" data-id="${d}" data-v="">Ubah</button>`}</div></div>`});

return h}

<div class="t12 sg" style="margin-left:60%"><b>${esc(p.kota)}, ${fmt(d)}<br>${esc(p.jabA)},<br><img src="${src}" style="height:72px"><br><u>${esc(p.atasan)}</u><br>NIP. ${esc(p.nipA)}</b></div>`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='hb'){document.body.classList.add('nav-open');return}if(b.id==='cl'){document.body.classList.remove('nav-open');return}
if(b.dataset.tab){document.body.classList.remove('nav-open');tab=b.dataset.tab;ui.ej=ui.ek=ui.et=null;return render()}

const a=b.dataset.act,id=b.dataset.id;if(!a)return;

if (a === 'delJ') { confirmDelete(() => { S.jurnal = S.jurnal.filter(x => x.id !== id) }); return; }

if(a==='addJ'){const u=val('ju').trim();if(!u)return alert('Uraian pekerjaan wajib diisi.');if(val('jj')==='skp'&&!val('js'))return alert('Pilih butir SKP, atau ubah jenis menjadi tugas tambahan.');
upsert(S.jurnal,'ej',{tgl:val('jt')||today(),uraian:u,output:val('jo'),qty:+val('jq')||0,link:val('jl'),skp:val('jj')==='skp'?val('js'):'',tambahan:val('jj')==='tambahan',tugas:val('jg')})}
else if(a==='impOk'){imp.items.forEach(x=>{const e=S.skp.find(k=>k.rhk.trim().toLowerCase().slice(0,30)===x.rhk.trim().toLowerCase().slice(0,30)),ex={};['link','base','pct0'].forEach(f=>{if(x[f]!==undefined&&x[f]!==''&&x[f]!==null)ex[f]=f==='link'?x[f]:+x[f]});if(e)Object.assign(e,{ind:x.ind,target:x.target||1,satuan:x.satuan,...ex});else S.skp.push({id:uid(),rhk:x.rhk,ind:x.ind,target:x.target||1,satuan:x.satuan,desc:'',...ex})});S.p.rhkPim=imp.pim||S.p.rhkPim;if(imp.baseTgl)S.baseTgl=imp.baseTgl;imp=null}else if(a==='impNo'){imp=null}else if(a==='impSep'){imp=sepData()}else if(a==='reschGo'){tab='tugas';ui.resched=id;return render()}else if(a==='apSave'){apSave();return}else if(a==='apPull'){apPull();return}else if(a==='apPush'){apPush();return}else if(a==='editJ'){ui.ej=id;ui.fresh=1}else if(a==='editK'){ui.ek=id;ui.fresh=1}else if(a==='editT'){ui.et=id;ui.fresh=1}else if(a==='cancelE'){ui.ej=ui.ek=ui.et=null}else if(a==='addK'){const r=val('kr').trim();if(!r)return alert('Isi butir SKP.');upsert(S.skp,'ek',{rhk:r,ind:val('ki'),link:val('kl'),base:+val('kb')||0,pct0:val('kq')===''?null:+val('kq'),target:+val('kt')||1,satuan:val('ks'),desc:val('kd')})}
else if(a==='addT'){const j=val('tj').trim();if(!j||!val('tdl'))return alert('Judul dan deadline wajib diisi.');
if(ui.et){const o=S.tugas.find(x=>x.id===ui.et),nd=val('tdl');let al='';if(nd!==o.deadline){al=val('tal').trim();if(!al)return alert('Deadline berubah: isi kolom "Alasan perubahan deadline" dulu.')}if(al){o.hist=o.hist||[];o.hist.push({tgl:today(),dari:o.deadline,ke:nd,alasan:al})}Object.assign(o,{judul:j,desc:val('td'),skp:val('tk'),mulai:val('tm')||today(),durasi:+val('tl')||1,deadline:nd});ui.et=null}else S.tugas.push({id:uid(),judul:j,desc:val('td'),skp:val('tk'),mulai:val('tm')||today(),durasi:+val('tl')||1,deadline:val('tdl'),progres:0,status:'berjalan',hist:[]})}
else if(a==='done'){const t=S.tugas.find(x=>x.id===id);t.status='selesai';t.progres=100;t.selesai=today()}
else if(a==='resch'){ui.resched=id||null;return render()}
else if(a==='reschOk'){const t=S.tugas.find(x=>x.id===id),al=val('rr').trim(),nd=val('rd');
if(!al)return alert('Jelaskan kendala/alasan perubahan waktu.');if(!nd)return alert('Tetapkan deadline baru.');
t.hist=t.hist||[];t.hist.push({tgl:today(),dari:t.deadline,ke:nd,alasan:al});t.deadline=nd;t.durasi=+val('rl')||t.durasi;ui.resched=null}
else if(a==='setA'){const v=val('al').trim();if(!/^https?:\/\//i.test(v))return alert('Tautan harus diawali http:// atau https://');S.absen=v;ui.editA=0}
else if(a==='gantiA'){ui.editA=1;return render()}
else if(a==='absen'){window.open(S.absen,'_blank','noopener');return}
else if(a==='libur'){const v=b.dataset.v;if(v==='')delete S.libur[id];else S.libur[id]=v==='1';if(wfhDate===id)wfhDate=null}
else if(a==='rep'){wfhDate=id;save();render();$('[data-act=addJ]').closest('.card').scrollIntoView({behavior:'smooth'});return}
else if(a==='pdf'){mkPdf(wfhDate);return}
else if(a==='dl'){dl();return}
save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='jj')togJ();if(t.id==='dpm'){ui.dm=t.value;render();return}if(t.id==='dpy'){ui.dy=+t.value;render();return}if(t.id==='pdf'&&t.files[0])readPdf(t.files[0]);if(t.dataset.act==='prog'){const o=S.tugas.find(x=>x.id===t.dataset.id);o.progres=+t.value;save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){S.p[t.dataset.p]=t.value;save()}
if(t.dataset.f&&imp)imp.items[t.dataset.i][t.dataset.f]=['target','base','pct0'].includes(t.dataset.f)?(t.value===''?'':+t.value):t.value;

$('#useS').onclick=()=>{if(m.kind==='skp'||m.o.skp){$('#jj').value='skp';togJ()}if(m.kind==='skp')$('#js').value=m.o.id;else{$('#jg').value=m.o.id;if(m.o.skp)$('#js').value=m.o.skp}s.innerHTML=''}}});
async function dl(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page WordSection1{size:330mm 215.9mm;mso-page-orientation:landscape;margin:12.7mm}div.WordSection1{page:WordSection1}.sg{margin-top:40px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px}.nb td{border:0}body{font-family:Arial;font-size:11pt}.t12{font-size:12pt}.t10 td,.t10 th{font-size:10pt}.t9 td,.t9 th{font-size:9pt}</style></head><body><div class="WordSection1">${repHTML(wfhDate,'file:///ttd.png')}</div></body></html>`;

await saveFile(name,new Blob([mht(html)],{type:'application/msword'}))}

return `<div class='card'><h3>Rincian kerja WFH — ${fmt(d,{weekday:'long',day:'numeric',month:'long'})}</h3><div class='mut'>Isi di sini. Otomatis masuk ke laporan di bawah, ke jurnal, dan ke progres SKP.</div>${rows||"<p class='mut'>Belum ada rincian kerja.</p>"}</div>`+jForm().replace(/id="jt" value="[^"]*"/,'id="jt" value="'+d+'" readonly').replace('Catat pekerjaan hari ini','Tambah rincian kerja')}

if((tab==='jurnal'||tab==='wfh')&&ui.ej){const j=S.jurnal.find(x=>x.id===ui.ej);if(!j){ui.ej=null;return}

async function mkPdf(d){try{
const L=PDFLib,pdf=await L.PDFDocument.create(),F=await pdf.embedFont(L.StandardFonts.Helvetica),FB=await pdf.embedFont(L.StandardFonts.HelveticaBold);
const W=936,H=612,M=36,CW=W-2*M,p=S.p,blk=L.rgb(0,0,0);let pg=pdf.addPage([W,H]),y=M;
const san=s=>String(s??'').replace(/[^\x20-\x7e\xa0-\xff\n]/g,'?');
const wrap=(t,fn,sz,w)=>{const o=[];san(t).split('\n').forEach(par=>{let ln='';par.split(' ').forEach(wd=>{while(fn.widthOfTextAtSize(wd,sz)>w){let k=1;while(k<wd.length&&fn.widthOfTextAtSize(wd.slice(0,k+1),sz)<=w)k++;if(ln){o.push(ln);ln=''}o.push(wd.slice(0,k));wd=wd.slice(k)}const tr=ln?ln+' '+wd:wd;if(!ln||fn.widthOfTextAtSize(tr,sz)<=w)ln=tr;else{o.push(ln);ln=wd}});o.push(ln)});return o};
const need=h=>{if(y+h>H-M){pg=pdf.addPage([W,H]);y=M}};
const txt=(s,x,top,fn,sz)=>pg.drawText(s,{x,y:H-top-sz,size:sz,font:fn,color:blk});
const para=(t,fn,sz,x=M,w=CW,ctr=false)=>{const lh=sz*1.3;wrap(t,fn,sz,w).forEach(l=>{need(lh);txt(l,ctr?x+(w-fn.widthOfTextAtSize(l,sz))/2:x,y,fn,sz);y+=lh})};
const table=(cols,head,rows,sz,minH)=>{const ws=cols.map(c=>c*CW),lh=sz*1.25,pd=4;
const row=(cells,fn,ctr)=>{const ls=cells.map((c,i)=>wrap(c,fn,sz,ws[i]-2*pd)),h=Math.max(minH,Math.max(...ls.map(a=>a.length))*lh+2*pd);need(h);let x=M;ls.forEach((a,i)=>{pg.drawRectangle({x,y:H-y-h,width:ws[i],height:h,borderColor:blk,borderWidth:.6});a.forEach((l,k)=>txt(l,ctr?x+(ws[i]-fn.widthOfTextAtSize(l,sz))/2:x+pd,y+pd+k*lh,fn,sz));x+=ws[i]});y+=h};
row(head,FB,true);rows.forEach(r=>row(r,F,false))};
para('Instrumen Laporan Kinerja Harian Pegawai yang Melaksanakan Work From Home (WFH)',FB,12,M,CW,true);y+=12;

[['Nama',p.nama],['NIP',p.nip],['Jabatan',p.jab],['Unit Kerja',p.unit],['Atasan Langsung',p.atasan]].forEach(r=>{need(14);txt(r[0],M+8,y,F,10);txt(':',M+142,y,F,10);const ls=wrap(r[1],F,10,CW-170);ls.forEach((l,k)=>txt(l,M+155,y+k*13,F,10));y+=ls.length*13});y+=12;

para(p.atasan,FB,12,sx,sw);const nw=FB.widthOfTextAtSize(san(p.atasan),12);pg.drawLine({start:{x:sx,y:H-(y-3.5)},end:{x:sx+Math.min(nw,sw),y:H-(y-3.5)},thickness:.7,color:blk});

if(S.skp.length)h+=`<div style='margin-top:12px'><b>Capaian SKP keseluruhan: ${tot}%</b><div class='bar'><i style='width:${tot}%'></i></div>${S.baseTgl?`<div class='mut'>Dihitung dari penilaian per ${fmt(S.baseTgl)} ditambah catatan jurnal sesudahnya.</div>`:''}</div>`;
return h+'</div>'}
function parseSkp(tx){tx=tx.replace(/\s+/g,' ');const a=tx.indexOf(' UTAMA ');if(a<0)return{items:[]};let b=tx.indexOf(' TAMBAHAN',a);if(b<0)b=tx.length;
const z=tx.slice(a+7,b).replace(/HASIL KERJA NO RENCANA.*?\(6\)/g,' ');const items=[];let pim='';
z.split(/(?=\b\d{1,2} Meningkatkan )/).forEach(sg=>{const m=sg.trim().match(/^(\d{1,2}) (Meningkatkan.*?) (Ter[a-z]+nya\b.*?) (?:Kuantitas|Kualitas|Waktu|Biaya) (.*)$/);if(!m)return;
const t=m[4].match(/^(.*) (\d{1,4}) ((?:Rangkap )?[A-Za-z]+)\s*$/);if(!t)return;pim=pim||m[2];items.push({rhk:m[3].trim(),ind:t[1].trim(),target:+t[2],satuan:t[3]})});return{items,pim}}
function parseEval(tx){tx=tx.replace(/\s+/g,' ');const a=tx.indexOf(' UTAMA ');if(a<0)return{items:[]};let b=tx.indexOf(' TAMBAHAN',a);if(b<0)b=tx.length;
const z=tx.slice(a+7,b).replace(/HASIL KERJA NO RENCANA.*?\(8\)/g,' ');const items=[];let pim='';
z.split(/(?=\b\d{1,2} Meningkatkan )/).forEach(sg=>{const m=sg.trim().match(/^(\d{1,2}) (Meningkatkan.*?) (Ter[a-z]+nya\b.*?) (?:Kuantitas|Kualitas|Waktu|Biaya) (.*?) (\d{1,4}) ((?:Rangkap )?Dokumen) (.*)$/);if(!m)return;
const r=m[7],pc=(r.match(/\(([\d.,]+)%\)/)||[])[1],qt=(r.match(/^(\d+(?:[.,]\d+)?) (?:Rangkap )?Dokumen/)||[])[1],lk=(r.match(/https:\/\/drive\.google\.com[\s\S]*?drive_link/)||[''])[0].replace(/\s/g,'');
const pct=pc?parseFloat(pc.replace(',','.')):null,tg=+m[5];pim=pim||m[2];
items.push({rhk:m[3].trim(),ind:m[4].trim(),target:tg,satuan:m[6],base:qt?parseFloat(qt.replace(',','.')):(pct!=null?Math.round(pct/100*tg*100)/100:0),pct0:pct,link:lk})});
const d=tx.match(/SD (\d{1,2}) ([A-Z]+) TAHUN (\d{4})/),mo=['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];
return{items,pim,baseTgl:d&&mo.indexOf(d[2])>=0?d[3]+'-'+String(mo.indexOf(d[2])+1).padStart(2,'0')+'-'+d[1].padStart(2,'0'):''}}

async function readPdf(f){const s=$('#impst');s.textContent='Membaca PDF...';
try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let tx='';
for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();tx+=c.items.map(x=>x.str).join(' ')+' '}
const r=/EVALUASI KINERJA/.test(tx)?parseEval(tx):parseSkp(tx);if(!r.items.length)throw 0;imp=r;render()}
catch(e){s.textContent='Butir SKP tidak berhasil dibaca otomatis. Pastikan PDF berupa teks (bukan hasil scan), atau tambahkan manual di bawah.'}}
